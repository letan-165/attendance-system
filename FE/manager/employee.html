<!doctype html>
<html lang="vi">
  <head>

    <title>Quản lý nhân viên</title>

  </head>

  <body>
    <div id="header-container"></div>

    <div class="layout">
      <div class="sidebar" id="sidebar-container-admin"></div>

      <div class="main">
        <div class="content">
          <h3>Danh sách nhân viên</h3>

          <div class="content-body">
            <table class="request-table">
              <thead>
                <tr>
                  <th>Mã</th>
                  <th>Tài khoản</th>
                  <th>Họ tên</th>
                  <th>Email</th>
                  <th>Ban</th>
                  <th>Trạng thái</th>
                  <th>Thao tác</th>
                </tr>
              </thead>

              <tbody id="user-table">
                <!-- JS render -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="../layout/layout.js"></script>
    <script type="module" src="./js/employee.js"></script>
  </body>
</html>
