<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý thời gian</title>

    <link rel="stylesheet" href="../layout/style.css" />
    <link rel="stylesheet" href="../layout/table.css" />
  </head>

  <body>
    <div id="header-container"></div>

    <div class="layout">
      <div class="sidebar" id="sidebar-container-admin"></div>

      <div class="main">
        <div class="content">
          <h3>Lịch sử giờ công</h3>
          <button class="btn primary" onclick="openDialog()">Tùy chỉnh</button>

          <div class="content-body">
            <table class="request-table">
              <thead>
                <tr>
                  <th>Ngày</th>
                  <th>Giờ bắt đầu</th>
                  <th>Giờ kết thúc</th>
                </tr>
              </thead>

              <tbody id="work-table">
                <!-- JS render -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <!-- Dialog -->
    <div id="work-dialog" class="dialog-overlay">
      <div class="dialog-box">
        <h4>Tùy chỉnh giờ công</h4>

        <label>Giờ bắt đầu:</label>
        <input id="startTime" type="time" />

        <label>Giờ kết thúc:</label>
        <input id="endTime" type="time" />

        <div class="dialog-actions">
          <button class="btn secondary" onclick="closeDialog()">Hủy</button>
          <button class="btn primary" onclick="submitWorkSchedule()">
            Lưu
          </button>
        </div>
      </div>
    </div>

    <script src="../layout/layout.js"></script>
    <script type="module" src="./js/time.js"></script>
  </body>
</html>
