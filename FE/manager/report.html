<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Kết quả chấm công</title>

    <link rel="stylesheet" href="../layout/style.css" />
    <link rel="stylesheet" href="../layout/table.css" />
  </head>

  <body>
    <div id="header-container"></div>

    <div class="layout">
      <div class="sidebar" id="sidebar-container-admin"></div>

      <div class="main">
        <!-- Cards -->
        <div class="cards">
          <div class="card">
            <h3>Đi muộn</h3>
            <p class="status-rejected card-number">03</p>
          </div>

          <div class="card">
            <h3>Đúng giờ</h3>
            <p class="status-approved card-number">12</p>
          </div>

          <div class="card">
            <h3>Tổng công tháng</h3>
            <p class="card-number">220 giờ</p>
          </div>
        </div>

        <!-- Table -->
        <div class="content">
          <h3>Bảng tổng hợp công tháng 01/2026</h3>

          <div class="content-body">
            <table class="request-table">
              <thead>
                <tr>
                  <th>Nhân viên</th>
                  <th>Số ngày công</th>
                  <th>Số giờ làm</th>
                  <th>Đi muộn (lần)</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>Nguyễn Hoàng Tuấn</td>
                  <td>10/10</td>
                  <td>80h</td>
                  <td>0</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="../layout/layout.js"></script>
  </body>
</html>
