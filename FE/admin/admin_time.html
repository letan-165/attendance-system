<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý thời gian</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <h2>Hệ thống chấm công</h2>
    <div class="user">Admin: Hoàng</div>
</div>
<div class="layout">
<div class="sidebar" id="sidebar-container"></div>
    <div class="main">
        <div class="content">
            <div class="content-header">Điều chỉnh giờ công (Log)</div>
            <div style="padding: 20px;">
                <p>Tìm nhân viên: <input type="text" placeholder="Nhập tên hoặc mã NV..."></p>
                <table class="history-table" style="width:100%">
                    <thead>
                        <tr>
                            <th>Ngày</th>
                            <th>Nhân viên</th>
                            <th>Giờ vào (Gốc)</th>
                            <th>Giờ ra (Gốc)</th>
                            <th>Cập nhật</th>
                        </tr>
                    </thead>
                    <tbody style="text-align:center">
                        <tr>
                            <td>13/01/2026</td>
                            <td>Nguyễn Văn Tuấn</td>
                            <td>08:05</td>
                            <td>--:--</td>
                            <td><button>Chỉnh sửa</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    fetch('sidebar_admin.html')
        .then(res => res.text())
        .then(html => {
            const container = document.getElementById('sidebar-container');
            container.innerHTML = html;

            const links = container.querySelectorAll('a');
            const currentPage = window.location.pathname.split('/').pop();

            links.forEach(link => {
                if (link.getAttribute('href') === 'admin_time.html') {
                    link.classList.add('active');
                }
            });
        });
</script>
</body>

</html>
