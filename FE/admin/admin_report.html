<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kết quả chấm công</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <h2>Hệ thống chấm công</h2>
    <div class="user">Admin: Hoàng</div>
</div>
<div class="layout">
   <div class="sidebar" id="sidebar-container"></div>
    <div class="main">
        <div class="cards">
            <div class="card">
                <h3>Đi muộn</h3>
                <p style="color:red; font-size:24px; font-weight:bold;">03</p>
            </div>
            <div class="card">
                <h3>Đúng giờ</h3>
                <p style="color:green; font-size:24px; font-weight:bold;">12</p>
            </div>
            <div class="card">
                <h3>Tổng công tháng</h3>
                <p>220 Giờ</p>
            </div>
        </div>
        <div class="content">
            <div class="content-header">Bảng tổng hợp công tháng 01/2026</div>
            <table class="history-table" style="width:100%">
                <thead>
                    <tr>
                        <th>Nhân viên</th>
                        <th>Số ngày công</th>
                        <th>Số giờ làm</th>
                        <th>Đi muộn (lần)</th>
                    </tr>
                </thead>
                <tbody style="text-align:center">
                    <tr>
                        <td>Nguyễn Văn Tuấn</td>
                        <td>10/10</td>
                        <td>80h</td>
                        <td>0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
    fetch('sidebar_admin.html')
        .then(res => res.text())
        .then(html => {
            const container = document.getElementById('sidebar-container');
            container.innerHTML = html;

            const links = container.querySelectorAll('a');
            const currentPage = window.location.pathname.split('/').pop();

            links.forEach(link => {
                if (link.getAttribute('href') === 'admin_report.html') {
                    link.classList.add('active');
                }
            });
        });
</script>
</body>

</html>
