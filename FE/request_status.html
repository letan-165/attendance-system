<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trạng thái yêu cầu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <h2>Hệ thống chấm công</h2>
    <div class="user">Tuấn</div>
</div>

<div class="layout">
    
    <div class="sidebar" id="sidebar-container"></div>

    <div class="main">
        <div class="content" style="padding: 20px;">
            <div class="content-header">Trạng thái yêu cầu</div>

            <table style="width:100%; margin-top:20px; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="text-align:left; padding:10px;">Loại yêu cầu</th>
                        <th style="text-align:left; padding:10px;">Ngày gửi</th>
                        <th style="text-align:left; padding:10px;">Trạng thái</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="padding:10px;">Quên check-in</td>
                        <td style="padding:10px;">12/01/2026</td>
                        <td style="padding:10px; color: orange;">Đang xử lý</td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">Xin nghỉ phép</td>
                        <td style="padding:10px;">10/01/2026</td>
                        <td style="padding:10px; color: green;">Đã duyệt</td>
                    </tr>
                    <tr>
                        <td style="padding:10px;">Khác</td>
                        <td style="padding:10px;">08/01/2026</td>
                        <td style="padding:10px; color: red;">Từ chối</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<script>
    fetch('sidebar_staff.html')
        .then(response => response.text())
        .then(data => {
            const container = document.getElementById('sidebar-container');
            container.innerHTML = data;

            const links = container.querySelectorAll('a');
            const currentPage = window.location.pathname.split("/").pop();

            links.forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
</script>

</body>
</html>
