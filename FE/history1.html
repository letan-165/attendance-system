<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lịch sử chấm công - Trang 2</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
    <h2>Hệ thống chấm công</h2>
    <div class="user">👤 Tuấn</div>
</div>

<div class="layout">

    <div class="sidebar" id="sidebar-container"></div>

    <div class="main">

        <div class="content">
            <div class="content-header">Lịch sử chấm công</div>
            <div class="content-body">

                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Ngày</th>
                            <th>Check-in</th>
                            <th>Check-out</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>04/01/2026</td>
                            <td>08:00</td>
                            <td>17:05</td>
                        </tr>
                        <tr>
                            <td>05/01/2026</td>
                            <td>08:03</td>
                            <td>17:01</td>
                        </tr>
                        <tr>
                            <td>06/01/2026</td>
                            <td>08:07</td>
                            <td>17:00</td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination" style="margin-top:16px;text-align:center">
                    <a href="history.html">← Trang trước</a>
                    <a href="history1.html">1</a>
                    <a class="active">2</a>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
    fetch('sidebar_staff.html')
        .then(res => res.text())
        .then(html => {
            const container = document.getElementById('sidebar-container');
            container.innerHTML = html;

            const links = container.querySelectorAll('a');
            links.forEach(link => {
                if (link.getAttribute('href') === 'history.html') {
                    link.classList.add('active');
                }
            });
        });
</script>

</body>
</html>
