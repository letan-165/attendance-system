<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng nhập - Hệ thống chấm công</title>
    <link rel="stylesheet" href="./layout/style.css" />
    <style>
      .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f4f7fb;
      }
      .login-box {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
      }
      .login-box input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .btn-login {
        width: 100%;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <h2>Đăng nhập</h2>

        <input type="text" placeholder="Tên đăng nhập" />
        <input type="password" placeholder="Mật khẩu" />

        <button
          class="btn primary btn-login"
          onclick="location.href = './staff/dashboard.html'"
        >
          Nhân viên
        </button>
        <button
          class="btn primary btn-login"
          onclick="location.href = './manager/support.html'"
        >
          Quản lí
        </button>
      </div>
    </div>
  </body>
</html>
