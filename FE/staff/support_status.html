    <link rel="stylesheet" href="../layout/table.css" />
  </head>

  <body>
    <div id="header-container"></div>

          <table class="request-table">

              </tr>
            </thead>
            <tbody id="support-table">
              <!-- JS render -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="../layout/layout.js"></script>
    <script type="module" src="./js/support_status.js"></script>
  </body>
</html>
