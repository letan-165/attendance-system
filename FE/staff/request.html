<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Gửi yêu cầu hỗ trợ</title>
    <link rel="stylesheet" href="../layout/style.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <div class="layout">
      <div class="sidebar" id="sidebar-container"></div>

      <div class="main">
        <div class="content" style="padding: 20px">
          <h3>Gửi yêu cầu hỗ trợ</h3>

          <!-- Mã chấm công -->
          <div style="margin-top: 20px">
            <label>Mã chấm công:</label>
            <div
              id="attendance-id"
              style="
                margin: 10px 0;
                padding: 10px;
                background: #f3f3f3;
                border-radius: 8px;
                font-weight: bold;
              "
            >
              --
            </div>

            <!-- Lý do -->
            <label>Lý do:</label>
            <textarea
              id="reason"
              placeholder="Nhập lý do hỗ trợ..."
              style="
                width: 100%;
                height: 120px;
                padding: 10px;
                margin: 10px 0;
                border-radius: 8px;
              "
            ></textarea>

            <button class="btn primary" id="btn-submit">Gửi yêu cầu</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../layout/layout.js"></script>
    <script type="module" src="./js/request.js"></script>
  </body>
</html>
