<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Gửi yêu cầu hỗ trợ</title>
    <link rel="stylesheet" href="../layout/style.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <div class="layout">
      <div class="sidebar" id="sidebar-container"></div>

      <div class="main">
        <div class="content" style="padding: 20px">
          <h3>Tạo yêu cầu mới</h3>

          <div style="margin-top: 20px">
            <label>Loại yêu cầu:</label><br />
            <select
              style="
                width: 100%;
                padding: 10px;
                margin: 10px 0;
                border-radius: 8px;
              "
            >
              <option>Quên check-in/out</option>
              <option>Xin nghỉ phép</option>
              <option>Khác</option>
            </select>

            <label>Nội dung chi tiết:</label><br />
            <textarea
              style="
                width: 100%;
                height: 100px;
                padding: 10px;
                margin: 10px 0;
                border-radius: 8px;
              "
            ></textarea>

            <button class="btn primary">Gửi yêu cầu</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../layout/layout.js"></script>
  </body>
</html>
