<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống chấm công</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <h2>Hệ thống chấm công</h2>
    <div class="user">Nhân viên</div>
</div>

<div class="layout">
    <div class="sidebar" id="sidebar-container"></div>

    <div class="main">
        <div class="actions">
            <button class="btn primary">✔ Check-in</button>
            <button class="btn secondary">⏱ Check-out</button>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Hôm nay</h3>
                <p>Check-in: --</p>
                <p>Check-out: --</p>
            </div>
            <div class="card">
                <h3>Trạng thái</h3>
                <p class="ok">Hoạt động</p>
            </div>
            <div class="card">
                <h3>Server</h3>
                <p>backend-02</p>
            </div>
        </div>

        <div class="content">
            <div class="content-header">Dashboard</div>
            <div class="content-body">
                <p><b>Check-in:</b> --</p>
                <p><b>Check-out:</b> --</p>
                <p><b>Số yêu cầu:</b> 0</p>
            </div>
        </div>
    </div>
</div>

<script>
fetch('sidebar_staff.html')
    .then(res => res.text())
    .then(html => {
        const container = document.getElementById('sidebar-container');
        container.innerHTML = html;

        const links = container.querySelectorAll('a');
        links.forEach(link => {
            if (link.getAttribute('href') === 'index.html') {
                link.classList.add('active');
            }
        });
    });
</script>

</body>
</html>
