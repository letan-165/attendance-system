<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Gửi yêu cầu hỗ trợ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <h2>Hệ thống chấm công</h2>
    <div class="user">Tuấn</div>
</div>

<div class="layout">
    
    <div class="sidebar" id="sidebar-container"></div>

    <div class="main">
        <div class="content" style="padding: 20px;">
            <div class="content-header">Tạo yêu cầu mới</div>

            <div style="margin-top: 20px;">
                <label>Loại yêu cầu:</label><br>
                <select style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px;">
                    <option>Quên check-in/out</option>
                    <option>Xin nghỉ phép</option>
                    <option>Khác</option>
                </select>

                <label>Nội dung chi tiết:</label><br>
                <textarea style="width: 100%; height: 100px; padding: 10px; margin: 10px 0; border-radius: 8px;"></textarea>

                <button class="btn primary">Gửi yêu cầu</button>
            </div>
        </div>
    </div>
</div>

<script>
    fetch('sidebar_staff.html')
        .then(response => response.text())
        .then(data => {
            const container = document.getElementById('sidebar-container');
            container.innerHTML = data;

            const links = container.querySelectorAll('a');
            const currentPage = window.location.pathname.split("/").pop();

            links.forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
</script>

</body>
</html>
